name: Print Example

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  print-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print message
        run: echo "Hello, this is my message"
